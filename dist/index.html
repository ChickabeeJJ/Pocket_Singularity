<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080B16">
<title>Pocket Singularity</title>
<meta name="description" content="Pulse gravity through a tiny universe and grow a black hole into a universe-eating machine.">
<style>
/* Pocket Singularity — fixed palette from the game bible. */
:root {
  --bg: #080B16;
  --bg2: #10162A;
  --card: #131C34;
  --line: #27314D;
  --text: #F0F4FF;
  --muted: #8D9ABA;
  --cyan: #6CE8FF;
  --violet: #A78BFA;
  --gold: #FFD783;
  --coral: #FF8B98;
  --green: #83F0C0;
  --ease: cubic-bezier(.22, .8, .3, 1);
  --radius: 10px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 1.3;
  overflow: hidden; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
svg { display: block; }

#app { height: 100%; display: flex; flex-direction: column; }

/* Header ------------------------------------------------------------------ */
.top {
  flex: 0 0 auto; height: 38px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px 0 12px; border-bottom: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.emblem { width: 24px; height: 24px; flex: 0 0 auto; }
.title { font-weight: 700; letter-spacing: .02em; font-size: 15px; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn, .chip {
  height: 28px; border: 1px solid var(--line); background: var(--bg2); border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted);
  transition: color 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
}
.icon-btn { width: 30px; padding: 0; }
.icon-btn svg { width: 16px; height: 16px; }
.chip { padding: 0 10px; font-size: 12px; font-weight: 600; }
.chip svg { width: 13px; height: 13px; color: var(--gold); }
.chip .num { color: var(--text); }
.icon-btn:hover, .chip:hover { color: var(--text); border-color: #3a4770; }
.chip.flash { animation: chipFlash 900ms var(--ease); }
@keyframes chipFlash { 0%, 100% { border-color: var(--line); } 30% { border-color: var(--gold); background: #2a2a2a33; } }
#btn-sound .snd-off { display: none; }
#btn-sound.muted .snd-on { display: none; }
#btn-sound.muted .snd-off { display: inline; }

/* Layout ------------------------------------------------------------------ */
.layout { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 10px; }
.play { flex: 0 0 64%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.side { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; overflow-x: hidden; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* Universe ---------------------------------------------------------------- */
.universe {
  position: relative; flex: 1 1 auto; min-height: 0; border-radius: 14px; overflow: hidden;
  background: #060914; border: 1px solid var(--line); touch-action: none; cursor: pointer;
}
.universe::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  box-shadow: inset 0 0 0 0 transparent; transition: box-shadow 400ms var(--ease);
}
.universe.surging::after { box-shadow: inset 0 0 60px 4px rgba(255, 215, 131, .22); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud-left, .hud-right { position: absolute; top: 10px; pointer-events: none; }
.hud-left { left: 12px; }
.hud-right { right: 12px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.matter { font-size: 30px; font-weight: 800; letter-spacing: -.01em; line-height: 1.05; text-shadow: 0 1px 10px rgba(8, 11, 22, .9); }
.matter.bump { animation: bump 220ms var(--ease); }
@keyframes bump { 40% { transform: scale(1.06); } }
.matter { transform-origin: left center; }
.rate { color: var(--green); font-size: 12px; font-weight: 600; min-height: 15px; }
.sector-name { font-weight: 700; font-size: 14px; }
.mut-chip {
  pointer-events: auto; margin-top: 6px; font-size: 11px; padding: 3px 8px; border-radius: 999px;
  background: rgba(16, 22, 42, .85); border: 1px solid var(--line); color: var(--muted); max-width: 210px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mut-chip b { color: var(--violet); font-weight: 700; }

.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); pointer-events: none;
  padding: 6px 14px; border-radius: 999px; background: rgba(8, 11, 22, .78); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; white-space: nowrap; transition: opacity 260ms var(--ease);
  animation: breathe 1.6s ease-in-out infinite;
}
.hint.hide { opacity: 0; }
.hint.comet { border-color: var(--gold); color: var(--gold); }
@keyframes breathe { 50% { transform: translateX(-50%) scale(1.04); } }

.surge-pill {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); pointer-events: none;
  padding: 4px 12px; border-radius: 999px; background: rgba(40, 32, 12, .85); border: 1px solid var(--gold);
  color: var(--gold); font-weight: 800; font-size: 12px; letter-spacing: .06em;
}
.banner {
  position: absolute; left: 50%; bottom: 52px; transform: translate(-50%, 8px); text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 380ms var(--ease), transform 380ms var(--ease); width: 90%;
}
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.banner .b-kicker { color: var(--cyan); font-size: 11px; letter-spacing: .22em; font-weight: 700; text-transform: uppercase; }
.banner .b-title { font-size: 26px; font-weight: 800; margin: 2px 0 4px; text-shadow: 0 2px 16px rgba(8, 11, 22, .95); }
.banner .b-sub { color: var(--muted); font-size: 12px; text-shadow: 0 1px 8px rgba(8, 11, 22, .95); }

.toasts { position: absolute; left: 12px; top: 88px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; max-width: min(46%, 300px); }
.toast {
  background: rgba(19, 28, 52, .94); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  padding: 6px 10px; border-radius: 8px; font-size: 12px; animation: toastIn 300ms var(--ease);
  transition: opacity 300ms var(--ease), transform 300ms var(--ease);
}
.toast b { color: var(--gold); }
.toast.green { border-left-color: var(--green); }
.toast.green b { color: var(--green); }
.toast.violet { border-left-color: var(--violet); }
.toast.violet b { color: var(--violet); }
.toast.out { opacity: 0; transform: translateX(-8px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }

/* Controls ---------------------------------------------------------------- */
.controls { flex: 0 0 auto; display: flex; gap: 10px; align-items: stretch; }
.pulse-btn {
  position: relative; overflow: hidden; flex: 0 0 auto; min-width: 190px; height: 48px; border-radius: 12px;
  border: 1px solid #3d8fa3; background: linear-gradient(180deg, #16304a, #0f2135); color: var(--text);
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px;
  transition: transform 120ms var(--ease), border-color 160ms var(--ease);
}
.pulse-btn:hover { border-color: var(--cyan); }
.pulse-btn:active, .pulse-btn.press { transform: scale(.97); }
.pulse-label { font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }
.pulse-key { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.pulse-cd { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--cyan); opacity: .8; }
.milestone { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 4px; }
.ms-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
.ms-text { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms-text b { color: var(--text); }
.ms-val { color: var(--text); white-space: nowrap; }
.bar { height: 8px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3aa9c4, var(--cyan)); border-radius: inherit; transition: width 200ms linear; }

/* Shop -------------------------------------------------------------------- */
.shop-head { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; padding: 0 2px; }
.buy-mode { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.buy-mode button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; padding: 3px 8px; }
.buy-mode button + button { border-left: 1px solid var(--line); }
.buy-mode button.on { background: var(--card); color: var(--cyan); }
.shop { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
.card {
  position: relative; display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 9px; align-items: center; text-align: left;
  width: 100%; padding: 7px 10px 7px 8px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card);
  transition: border-color 160ms var(--ease), background 160ms var(--ease), transform 120ms var(--ease), opacity 160ms var(--ease);
}
.card .ic { grid-row: 1 / span 2; width: 30px; height: 30px; border-radius: 8px; background: var(--bg2); display: flex; align-items: center; justify-content: center; color: var(--cyan); }
.card .ic svg { width: 20px; height: 20px; }
.card .nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .lv { color: var(--muted); font-size: 11px; font-weight: 600; margin-left: 4px; }
.card .fx { grid-column: 2; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .fx em { font-style: normal; color: var(--text); }
.card .cost { grid-column: 3; grid-row: 1 / span 2; text-align: right; font-weight: 800; font-size: 13px; color: var(--muted); white-space: nowrap; }
.card .cost small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
.card.can { border-color: #2f6f82; }
.card.can .cost { color: var(--cyan); }
.card.can:hover { border-color: var(--cyan); background: #16223f; }
.card.can:active { transform: scale(.985); }
.card.cant { cursor: default; }
.card.cant .ic { color: var(--muted); }
.card.max { cursor: default; border-color: #4a4430; }
.card.max .cost { color: var(--gold); }
.card.max .ic { color: var(--gold); }
.card.new::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px solid var(--cyan); animation: ready 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes ready { 50% { opacity: .15; } }
.card.bought { animation: bought 360ms var(--ease); }
@keyframes bought { 30% { background: #1b3352; } }
.card .key { position: absolute; top: 3px; right: 5px; font-size: 9px; color: #4b5779; display: none; }
@media (hover: hover) and (min-width: 701px) { .card .key { display: block; } .card .cost { padding-top: 6px; } }

/* Collapse card ----------------------------------------------------------- */
.collapse-card { flex: 0 0 auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg2); padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }
.collapse-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.collapse-card .ct { font-weight: 700; font-size: 13px; color: var(--violet); }
.collapse-card .cs { font-size: 11px; color: var(--muted); }
.collapse-card .cs b { color: var(--text); }
.sd { color: var(--violet); font-weight: 800; }
.btn {
  height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px;
  transition: border-color 160ms var(--ease), background 160ms var(--ease), transform 120ms var(--ease);
}
.btn:hover { border-color: #3a4770; }
.btn:active { transform: scale(.97); }
.btn.primary { border-color: var(--cyan); background: #12324a; color: var(--text); }
.btn.violet { border-color: var(--violet); background: #2a2150; }
.btn.danger { border-color: var(--coral); background: #3a1a24; }
.btn.gold { border-color: var(--gold); background: #3a3018; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.collapse-card .btn { height: 30px; font-size: 12px; }
.mini-bar { height: 5px; border-radius: 9px; background: var(--card); overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--violet); width: 0; }

/* Modal ------------------------------------------------------------------- */
.modal { position: fixed; inset: 0; background: rgba(4, 6, 12, .72); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 14px; animation: fade 200ms var(--ease); }
.modal[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.modal-box {
  position: relative; width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--bg2); border: 1px solid var(--line);
  border-radius: 14px; padding: 18px 18px 16px; animation: pop 260ms var(--ease);
}
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.modal-box h2 { margin: 0 28px 10px 0; font-size: 18px; }
.modal-x { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; }
.modal-x svg { width: 14px; height: 14px; }
#modal-body { font-size: 13px; color: var(--muted); }
#modal-body p { margin: 0 0 10px; }
#modal-body b { color: var(--text); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.big-gain { font-size: 30px; font-weight: 800; color: var(--green); margin: 4px 0 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.cols > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.cols h3 { margin: 0 0 5px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.cols ul { margin: 0; padding-left: 16px; }
.cols li { margin: 2px 0; }
.h-reset { color: var(--coral); }
.h-keep { color: var(--green); }
.research { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.rnode { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.rnode .rn { font-weight: 700; color: var(--text); }
.rnode .rd { font-size: 12px; grid-column: 1; }
.rnode .rc { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 800; color: var(--muted); }
.rnode.on { border-color: #4d3f86; }
.rnode.on .rc { color: var(--violet); }
.atlas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
.atlas .ae { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 86px; display: flex; flex-direction: column; gap: 4px; }
.atlas .ae svg { width: 26px; height: 26px; }
.atlas .an { font-weight: 700; font-size: 12px; color: var(--text); }
.atlas .ad { font-size: 11px; line-height: 1.25; }
.atlas .ae.locked { opacity: .55; }
.atlas .ae.locked .an { color: var(--muted); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-of-type { border-bottom: 0; }
.switch { width: 44px; height: 24px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 180ms var(--ease), background 180ms var(--ease); }
.switch.on { border-color: var(--cyan); }
.switch.on::after { transform: translateX(20px); background: var(--cyan); }
.small { font-size: 11px; color: var(--muted); }

/* Compact desktop heights (907×510 iframe and smaller) -------------------- */
@media (max-height: 560px) and (min-width: 701px) {
  .top { height: 34px; }
  .layout { padding: 8px; gap: 8px; }
  .play { gap: 7px; }
  .pulse-btn { height: 44px; min-width: 176px; }
  .card { padding: 5px 9px 5px 7px; }
  .card .ic { width: 28px; height: 28px; }
  .shop { gap: 5px; }
  .side { gap: 6px; }
  .matter { font-size: 26px; }
}
@media (max-height: 420px) and (min-width: 701px) {
  .card .fx { display: none; }
  .card .ic { grid-row: 1; height: 24px; width: 24px; }
  .card .cost { grid-row: 1; }
  .pulse-btn { height: 38px; min-width: 150px; }
  .pulse-key { display: none; }
  .milestone { gap: 3px; }
}

/* Narrow / portrait: stack, playfield first, shop scrolls beneath ---------- */
@media (max-width: 700px) {
  .top { height: 40px; }
  .title { font-size: 14px; }
  .chip span:not(.num) { display: none; }
  .layout { flex-direction: column; padding: 8px; gap: 8px; }
  .play { flex: 1 1 56%; min-height: 0; }
  .side { flex: 0 1 44%; min-height: 150px; padding-bottom: env(safe-area-inset-bottom); }
  .controls { flex-direction: column-reverse; gap: 7px; }
  .pulse-btn { width: 100%; height: 50px; }
  .pulse-key { display: none; }
  .matter { font-size: 24px; }
  .banner .b-title { font-size: 21px; }
  .atlas { grid-template-columns: repeat(2, 1fr); }
  .cols { grid-template-columns: 1fr; }
  .mut-chip { max-width: 150px; }
}

@media (prefers-reduced-motion: reduce) {
  .hint, .card.new::before { animation: none; }
}
body.reduced .hint, body.reduced .card.new::before, body.reduced .matter.bump { animation: none; }

/* Store-art mode (index.html?cover=1): only the universe and the title. */
body.cover .top, body.cover .side, body.cover .controls, body.cover .hud-left, body.cover .hud-right, body.cover .hint, body.cover .toasts { display: none !important; }
body.cover .layout { padding: 0; }
body.cover .play { flex: 1 1 100%; }
body.cover .universe { border: 0; border-radius: 0; }
.cover-title { position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; pointer-events: none; line-height: .95; text-shadow: 0 4px 40px rgba(8, 11, 22, .95); }
.cover-title .ct1 { font-size: 6.2vmin; font-weight: 700; letter-spacing: .5em; color: var(--cyan); margin-right: -.5em; }
.cover-title .ct2 { font-size: 13vmin; font-weight: 900; letter-spacing: .02em; color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="emblem" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="#6CE8FF" stroke-width="1.6" opacity=".7"/>
        <circle cx="16" cy="16" r="7" fill="#05070E" stroke="#6CE8FF" stroke-width="1.4"/>
        <path d="M2 16a14 5.5 0 0 0 28 0" fill="none" stroke="#A78BFA" stroke-width="1.6"/>
      </svg>
      <span class="title">Pocket Singularity</span>
    </div>
    <div class="top-actions">
      <button id="btn-atlas" class="chip" type="button" title="Discovery Atlas">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>
        <span>Atlas</span><span id="atlas-count" class="num">0/16</span>
      </button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="Mute sound" title="Sound (M)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z" fill="currentColor"/><path class="snd-on" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="snd-off" d="M10.5 5.5l4 5m0-5-4 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10.5" cy="4.5" r="1.9" fill="#10162A" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="11.5" r="1.9" fill="#10162A" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="play">
      <div class="universe" id="universe">
        <canvas id="cv" aria-label="The universe. Tap or press Space to pulse gravity."></canvas>
        <div class="hud-left">
          <div class="label">Matter</div>
          <div id="matter" class="matter num">0</div>
          <div id="rate" class="rate num"></div>
        </div>
        <div class="hud-right">
          <div class="label">Sector <span id="sector-num" class="num">1</span></div>
          <div id="sector-name" class="sector-name">Dust Cloud</div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-x" class="modal-x" type="button" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</div>

<script>
/* Pocket Singularity — core rules.
 * Pure game logic: balance data, economy, saves, and the fragment world simulation.
 * No DOM access here, so the same file runs in the browser and in Node (tools/sim.js, tests/).
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------------
  // Balance data. Every tuning value lives here.
  // ---------------------------------------------------------------------------
  const CONFIG = {
    saveVersion: 1,
    pulseCooldown: 0.36,      // seconds between pulses
    pulseBuffer: 0.16,        // a click this close to the end of cooldown is queued, not dropped
    ringSpeed: 2.6,           // field units per second
    coreRadius: 0.115,        // base core radius (field units, field edge = 1)
    swallowRadius: 0.2,       // drifting fragments inside this are eaten on their own
    drift: 0.014,             // inward drift speed of orbiting fragments
    offlineCapMs: 2 * 60 * 60 * 1000,
    offlineRate: 0.5,
    awayThresholdMs: 5000,    // longer real gaps than this are treated as "away"
    startFragments: 16,

    fragments: {
      dust:    { value: 1.0,  label: 'Dust' },
      ice:     { value: 1.35, label: 'Ice' },
      crystal: { value: 2.5,  label: 'Star crystal' },
      shard:   { value: 1.8,  label: 'Unstable shard', blast: 0.3 }
    },

    upgrades: [
      { id: 'radius',    name: 'Wider Event Horizon', desc: 'Pulse reaches further',       base: 20,  growth: 1.55, max: 12 },
      { id: 'density',   name: 'Matter Density',      desc: 'More fragments drift in',     base: 22,  growth: 1.48, max: 20 },
      { id: 'drones',    name: 'Orbital Drones',      desc: 'Collect Matter on their own', base: 45,  growth: 1.16, max: 100 },
      { id: 'resonance', name: 'Resonance',           desc: 'Bigger chain bonus',          base: 60,  growth: 1.62, max: 15 },
      { id: 'focus',     name: 'Pulse Focus',         desc: 'Everything is worth more',    base: 120, growth: 1.9,  max: 40 }
    ],

    // Five hand-made sectors; later ones are generated from these (see sectorInfo).
    sectors: [
      { name: 'Dust Cloud',     at: 0,     value: 1,    mix: { dust: 88, ice: 11, crystal: 1.2, shard: 0 } },
      { name: 'Shattered Belt', at: 1.5e3, value: 1.5,  mix: { dust: 60, ice: 22, crystal: 2.5, shard: 14 } },
      { name: 'Frozen Moon',    at: 4e4,   value: 2.25, mix: { dust: 36, ice: 50, crystal: 4, shard: 10 } },
      { name: 'Nebula Engine',  at: 1e6,   value: 3.4,  mix: { dust: 36, ice: 22, crystal: 6, shard: 34 } },
      { name: 'Star Nursery',   at: 2.5e7, value: 5,    mix: { dust: 30, ice: 26, crystal: 24, shard: 20 } }
    ],
    sectorGrowth: 12,       // threshold multiplier for each generated sector after the fifth
    sectorValueGrowth: 1.5,

    collapse: { minSector: 3, base: 3.6e4, step: 0.25 },  // Stardust = floor(cbrt(run / base)); +25% each

    research: [
      { id: 'echo',   at: 3,  name: 'Echo Pulse',        desc: 'The core pulses by itself every 5 s' },
      { id: 'lure',   at: 10, name: 'Comet Lure',        desc: 'Comets appear 40% more often; Surges last longer' },
      { id: 'memory', at: 25, name: 'Deep Memory',       desc: 'Away income 50% → 80%; each run starts with 3 drones' },
      { id: 'anchor', at: 60, name: 'Horizon Anchor',    desc: 'Event Horizon and Density levels survive Collapse' }
    ],

    comet: { first: 45, min: 70, max: 140, speed: 0.24, surge: 20, surgeMult: 3 },
    echoInterval: 5,
    atlasStep: 0.03,

    mutations: [
      { id: 'frost',    name: 'Frost Tide',     desc: 'Ice fragments are worth 2×',           ice: 2 },
      { id: 'wide',     name: 'Wide Field',     desc: 'Pulses reach 15% further',             radius: 1.15 },
      { id: 'bloom',    name: 'Crystal Bloom',  desc: 'Star crystals are 3× more common',     crystalW: 3 },
      { id: 'swarm',    name: 'Drone Swarm',    desc: 'Drones collect 50% more',              drones: 1.5 },
      { id: 'season',   name: 'Comet Season',   desc: 'Comets arrive twice as often',         comets: 2 },
      { id: 'resonant', name: 'Resonant Day',   desc: 'Chain bonus is 50% stronger',          chain: 1.5 },
      { id: 'volatile', name: 'Volatile Skies', desc: 'More unstable shards, bigger blasts',  shardW: 2.5, blast: 1.35 },
      { id: 'dense',    name: 'Dense Void',     desc: 'Fragments drift in 25% faster',        spawn: 1.25 }
    ],

    discoveries: [
      { id: 'f_dust',    name: 'Stellar Dust',      desc: 'The common grain of every universe.' },
      { id: 'f_ice',     name: 'Ice Fragment',      desc: 'Frozen water from a comet that never was.' },
      { id: 'f_crystal', name: 'Star Crystal',      desc: 'Compressed starlight. Rare and bright.' },
      { id: 'f_shard',   name: 'Unstable Shard',    desc: 'Bursts when swallowed, dragging neighbours in.' },
      { id: 'comet',     name: 'Wandering Comet',   desc: 'Catch one in a pulse to trigger a Surge.' },
      { id: 'chain5',    name: 'Resonant Chain',    desc: 'Capture 5 fragments with one pulse.' },
      { id: 'chain12',   name: 'Cascade',           desc: 'Capture 12 fragments with one pulse.' },
      { id: 'chain25',   name: 'Avalanche',         desc: 'Capture 25 fragments with one pulse.' },
      { id: 'reaction',  name: 'Chain Reaction',    desc: 'One shard blast pulls in 3 more fragments.' },
      { id: 'golden',    name: 'Golden Hour',       desc: 'Swallow a Star Crystal during a Surge.' },
      { id: 's1',        name: 'Shattered Belt',    desc: 'Reach the second sector.' },
      { id: 's2',        name: 'Frozen Moon',       desc: 'Reach the third sector.' },
      { id: 's3',        name: 'Nebula Engine',     desc: 'Reach the fourth sector.' },
      { id: 's4',        name: 'Star Nursery',      desc: 'Reach the fifth sector.' },
      { id: 'drones25',  name: 'Drone Constellation', desc: 'Command 25 Orbital Drones.' },
      { id: 'collapse',  name: 'First Collapse',    desc: 'Fold a universe into Stardust.' }
    ]
  };

  const UPG = {};
  CONFIG.upgrades.forEach(function (u, i) { u.index = i; UPG[u.id] = u; });

  // ---------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function num(v, fallback) { return (typeof v === 'number' && isFinite(v)) ? v : fallback; }
  function nonNeg(v) { return Math.max(0, num(v, 0)); }
  function int(v, lo, hi) { return clamp(Math.floor(num(v, lo)), lo, hi); }

  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  function fmt(n) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + fmt(-n);
    if (n < 100) return n < 10 && n % 1 > 0.05 ? n.toFixed(1) : String(Math.floor(n));
    if (n < 1000) return String(Math.floor(n));
    const tier = Math.floor(Math.log10(n) / 3);
    if (tier >= SUFFIX.length) return n.toExponential(2).replace('+', '');
    const scaled = n / Math.pow(1000, tier);
    const digits = scaled < 10 ? 2 : scaled < 100 ? 1 : 0;
    // Truncate rather than round so 999.96K never displays as 1000.0K.
    const p = Math.pow(10, digits);
    return (Math.floor(scaled * p) / p).toFixed(digits) + SUFFIX[tier];
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashString(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function toRoman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = '';
    for (const [v, s] of map) while (n >= v) { out += s; n -= v; }
    return out;
  }

  // ---------------------------------------------------------------------------
  // State & saves
  // ---------------------------------------------------------------------------
  function freshLevels() { return { radius: 0, density: 0, drones: 0, resonance: 0, focus: 0 }; }

  function createState(now) {
    return {
      v: CONFIG.saveVersion,
      matter: 0,
      runTotal: 0,
      lifetime: 0,
      levels: freshLevels(),
      sector: 0,
      maxSector: 0,
      stardust: 0,
      collapses: 0,
      discoveries: {},
      stats: { pulses: 0, captures: 0, bestChain: 0, comets: 0, playTime: 0, runTime: 0 },
      milestones: {},          // seconds of play when key moments first happened (local playtest telemetry)
      settings: { muted: false, reducedMotion: null, buyMode: 1 },
      lastSeen: now || 0,
      created: now || 0
    };
  }

  // Accepts anything (including garbage) and returns a valid state plus whether it was intact.
  function sanitize(raw, now) {
    const s = createState(now);
    if (!raw || typeof raw !== 'object') return { state: s, ok: false };
    const ok = raw.v === CONFIG.saveVersion &&
      ['matter', 'runTotal', 'lifetime'].every(function (k) { return typeof raw[k] === 'number' && isFinite(raw[k]) && raw[k] >= 0; });
    s.matter = nonNeg(raw.matter);
    s.runTotal = nonNeg(raw.runTotal);
    s.lifetime = Math.max(nonNeg(raw.lifetime), s.runTotal);
    s.matter = Math.min(s.matter, s.lifetime);  // cannot hold more than was ever earned
    const lv = raw.levels && typeof raw.levels === 'object' ? raw.levels : {};
    CONFIG.upgrades.forEach(function (u) { s.levels[u.id] = int(lv[u.id], 0, u.max); });
    s.stardust = Math.floor(nonNeg(raw.stardust));
    s.collapses = Math.floor(nonNeg(raw.collapses));
    // The sector is derived from run progress, never trusted from the file.
    s.sector = sectorFor(s.runTotal);
    s.maxSector = Math.max(int(raw.maxSector, 0, 99), s.sector);
    const known = {};
    CONFIG.discoveries.forEach(function (d) { known[d.id] = true; });
    if (raw.discoveries && typeof raw.discoveries === 'object') {
      Object.keys(raw.discoveries).forEach(function (k) {
        if (known[k]) s.discoveries[k] = nonNeg(raw.discoveries[k]) || 1;
      });
    }
    const st = raw.stats && typeof raw.stats === 'object' ? raw.stats : {};
    Object.keys(s.stats).forEach(function (k) { s.stats[k] = nonNeg(st[k]); });
    const ms = raw.milestones && typeof raw.milestones === 'object' ? raw.milestones : {};
    Object.keys(ms).forEach(function (k) { if (/^[A-Za-z0-9_]{1,24}$/.test(k)) s.milestones[k] = nonNeg(ms[k]); });
    const set = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
    s.settings.muted = set.muted === true;
    s.settings.reducedMotion = typeof set.reducedMotion === 'boolean' ? set.reducedMotion : null;
    s.settings.buyMode = [1, 10, 0].indexOf(set.buyMode) >= 0 ? set.buyMode : 1;
    s.lastSeen = nonNeg(raw.lastSeen) || (now || 0);
    s.created = nonNeg(raw.created) || (now || 0);
    return { state: s, ok: ok };
  }

  function serialize(state) { return JSON.stringify(state); }

  function parseSave(text, now) {
    if (typeof text !== 'string' || !text) return null;
    try { return sanitize(JSON.parse(text), now); } catch (e) { return { state: createState(now), ok: false, broken: true }; }
  }

  // ---------------------------------------------------------------------------
  // Sectors, mutations, research
  // ---------------------------------------------------------------------------
  function sectorInfo(i) {
    const base = CONFIG.sectors;
    if (i < base.length) return Object.assign({ index: i, palette: i, tier: 0 }, base[i]);
    const tier = Math.floor(i / base.length);
    const src = base[i % base.length];
    const last = base[base.length - 1];
    const extra = i - (base.length - 1);
    return {
      index: i,
      palette: i % base.length,
      tier: tier,
      name: src.name + ' ' + toRoman(tier + 1),
      at: last.at * Math.pow(CONFIG.sectorGrowth, extra),
      value: last.value * Math.pow(CONFIG.sectorValueGrowth, extra),
      mix: base[Math.max(1, i % base.length)].mix
    };
  }

  function sectorFor(runTotal) {
    let i = 0;
    while (i < 98 && runTotal >= sectorInfo(i + 1).at) i++;
    return i;
  }

  function dayKey(date) {
    const d = date || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function mutationFor(key) {
    const list = CONFIG.mutations;
    const i = hashString('ps:' + key) % list.length;
    // Never repeat yesterday's mutation.
    const parts = key.split('-').map(Number);
    const prev = new Date(parts[0], parts[1] - 1, parts[2] - 1);
    const j = hashString('ps:' + dayKey(prev)) % list.length;
    return list[i === j ? (i + 1) % list.length : i];
  }

  function researchFlags(state) {
    const out = {};
    CONFIG.research.forEach(function (r) { out[r.id] = state.stardust >= r.at; });
    return out;
  }

  function discoveryCount(state) { return Object.keys(state.discoveries).length; }

  // ---------------------------------------------------------------------------
  // Economy
  // ---------------------------------------------------------------------------
  function upgradeCost(id, level) {
    const u = UPG[id];
    return Math.ceil(u.base * Math.pow(u.growth, level));
  }

  // Cost and count for buying up to `want` levels (0 = as many as affordable).
  function bulkQuote(state, id, want) {
    const u = UPG[id];
    let lvl = state.levels[id], cost = 0, n = 0;
    const limit = want === 0 ? u.max : Math.min(u.max, lvl + want);
    while (lvl < limit) {
      const c = upgradeCost(id, lvl);
      if (want === 0 && cost + c > state.matter) break;
      cost += c; lvl++; n++;
    }
    if (n === 0 && lvl < u.max) { cost = upgradeCost(id, lvl); n = 1; }  // show the next level's price
    return { n: n, cost: cost, maxed: state.levels[id] >= u.max };
  }

  function buy(state, id, want) {
    const u = UPG[id];
    if (!u) return 0;
    const q = bulkQuote(state, id, want);
    if (q.maxed || q.cost > state.matter || q.n === 0) return 0;
    state.matter -= q.cost;
    state.levels[id] += q.n;
    return q.n;
  }

  function derive(state, mut) {
    mut = mut || {};
    const L = state.levels;
    const sec = sectorInfo(state.sector);
    const sdMult = 1 + CONFIG.collapse.step * state.stardust;
    const atlasMult = 1 + CONFIG.atlasStep * discoveryCount(state);
    const focusMult = Math.pow(1.32, L.focus);
    const valueMult = focusMult * sec.value * sdMult * atlasMult;
    const droneMilestone = Math.pow(2, Math.floor(L.drones / 25));
    const mix = Object.assign({}, sec.mix);
    if (mut.crystalW) mix.crystal *= mut.crystalW;
    // Volatile days also sprinkle a few shards into the first sector, so the bonus is never empty.
    if (mut.shardW) mix.shard = Math.max(mix.shard, 2) * mut.shardW;
    const research = researchFlags(state);
    return {
      sector: sec,
      valueMult: valueMult,
      focusMult: focusMult,
      sdMult: sdMult,
      atlasMult: atlasMult,
      pulseRadius: Math.min(1.1, (0.46 + 0.045 * L.radius) * (mut.radius || 1)),
      spawnRate: 1.35 * Math.pow(1.12, L.density) * (mut.spawn || 1),
      cap: 14 + 2 * L.density,
      chainStep: (0.08 + 0.045 * L.resonance) * (mut.chain || 1),
      dronePerSec: L.drones * 0.5 * droneMilestone * valueMult * (mut.drones || 1),
      typeValue: { dust: 1, ice: CONFIG.fragments.ice.value * (mut.ice || 1), crystal: CONFIG.fragments.crystal.value, shard: CONFIG.fragments.shard.value },
      blast: CONFIG.fragments.shard.blast * (mut.blast || 1),
      mix: mix,
      cometRate: (mut.comets || 1) * (research.lure ? 1.4 : 1),
      surgeDur: CONFIG.comet.surge * (research.lure ? 1.5 : 1),
      echo: research.echo,
      offlineRate: research.memory ? 0.8 : CONFIG.offlineRate,
      research: research
    };
  }

  function chainMult(stats, n) { return 1 + stats.chainStep * Math.max(0, n - 1); }

  function earn(state, amount) {
    if (!(amount > 0) || !isFinite(amount)) return 0;
    state.matter += amount;
    state.runTotal += amount;
    state.lifetime += amount;
    return amount;
  }

  // ---------------------------------------------------------------------------
  // Collapse (prestige)
  // ---------------------------------------------------------------------------
  function stardustFor(state) {
    return Math.floor(Math.cbrt(state.runTotal / CONFIG.collapse.base) + 1e-9);
  }
  function canCollapse(state) {
    return state.sector >= CONFIG.collapse.minSector && stardustFor(state) >= 1;
  }
  function doCollapse(state) {
    if (!canCollapse(state)) return 0;
    const gain = stardustFor(state);
    const anchor = researchFlags(state).anchor;
    const keep = { radius: state.levels.radius, density: state.levels.density };
    state.stardust += gain;
    state.collapses += 1;
    state.matter = 0;
    state.runTotal = 0;
    state.sector = 0;
    state.levels = freshLevels();
    const r = researchFlags(state);
    if (anchor) { state.levels.radius = keep.radius; state.levels.density = keep.density; }
    if (r.memory) state.levels.drones = 3;
    state.stats.runTime = 0;
    return gain;
  }

  // Matter granted for time away. Elapsed is clamped; clock changes yield zero.
  function awayGain(state, stats, elapsedMs) {
    const ms = clamp(num(elapsedMs, 0), 0, CONFIG.offlineCapMs);
    return { ms: ms, gain: stats.dronePerSec * (ms / 1000) * stats.offlineRate };
  }

  // ---------------------------------------------------------------------------
  // Progress checks: sectors and discoveries
  // ---------------------------------------------------------------------------
  function discover(state, id, ev) {
    if (state.discoveries[id]) return false;
    state.discoveries[id] = Math.max(1, Math.round(state.stats.playTime));
    if (ev) ev.push({ t: 'discover', id: id });
    return true;
  }

  function checkProgress(state, ev) {
    const target = sectorFor(state.runTotal);
    while (state.sector < target) {
      state.sector++;
      if (state.sector > state.maxSector) state.maxSector = state.sector;
      if (state.sector <= 4) discover(state, 's' + state.sector, ev);
      mark(state, 'sector' + state.sector);
      if (ev) ev.push({ t: 'sector', index: state.sector });
    }
    if (state.levels.drones >= 25) discover(state, 'drones25', ev);
    if (state.collapses > 0) discover(state, 'collapse', ev);
  }

  function mark(state, key) {
    if (state.milestones[key] === undefined) state.milestones[key] = Math.round(state.stats.playTime);
  }

  // ---------------------------------------------------------------------------
  // World simulation
  // ---------------------------------------------------------------------------
  const ORBIT = 0, FALL = 1;

  function createWorld(rng, state, stats) {
    const w = {
      rng: rng || Math.random,
      frags: [],
      rings: [],
      groups: [],
      comet: null,
      cometTimer: CONFIG.comet.first,
      surge: 0,
      cooldown: 0,
      queued: false,
      spawnAcc: 0,
      echoTimer: CONFIG.echoInterval,
      time: 0
    };
    if (state && stats) {
      for (let i = 0; i < CONFIG.startFragments; i++) {
        // Seed the field so the very first pulse always catches something.
        const f = spawnFragment(w, stats, i < 6 ? 0.25 + w.rng() * 0.17 : null);
        f.alpha = 1;
      }
    }
    return w;
  }

  function pickType(rng, mix) {
    let total = 0;
    for (const k in mix) total += mix[k];
    let roll = rng() * total;
    for (const k in mix) { roll -= mix[k]; if (roll <= 0) return k; }
    return 'dust';
  }

  function spawnFragment(w, stats, r) {
    const rng = w.rng;
    const type = pickType(rng, stats.mix);
    const radius = r != null ? r : 0.32 + Math.pow(rng(), 0.7) * 0.72;
    const f = {
      type: type,
      r: radius,
      a: rng() * Math.PI * 2,
      dir: 1,
      size: 0.85 + rng() * 0.4,
      spin: rng() * Math.PI * 2,
      wob: rng() * Math.PI * 2,
      state: ORBIT,
      alpha: 0,
      t: 0, delay: 0, dur: 0, r0: 0, a0: 0,
      group: null,
      inRange: false
    };
    w.frags.push(f);
    return f;
  }

  function fragPos(f) { return { x: Math.cos(f.a) * f.r, y: Math.sin(f.a) * f.r * 0.82 }; }
  function dist(x, y) { return Math.sqrt(x * x + y * y); }
  // Distances are measured in the flattened orbital plane so the visible range ellipse matches the rules.
  function fragDist(f) { const p = fragPos(f); return dist(p.x, p.y / 0.82); }

  function newGroup(w, auto) {
    const g = { count: 0, base: 0, landed: 0, credited: 0, auto: !!auto, hadCrystal: false, done: false, blastCount: 0 };
    w.groups.push(g);
    return g;
  }

  function catchFrag(w, f, g, delay) {
    f.state = FALL;
    f.group = g;
    f.t = 0;
    f.delay = delay;
    f.dur = 0.22 + f.r * 0.32;
    f.r0 = f.r;
    f.a0 = f.a;
    g.count++;
  }

  function canPulse(w) { return w.cooldown <= 0; }

  // Returns true if a pulse fired (or was queued).
  function pulse(w, state, stats, ev, auto) {
    if (w.cooldown > 0) {

    { name: 'nursery', bg: ['#1C130C', '#0A0810'], neb: ['#7A5520', '#8A4A3A', '#4A2A6A'], stars: 200, ambient: 'nursery', star: '#FFF0D0' }
  ];
  const SECTOR_NEWS = [
    '',
    'Unstable shards appear — they burst and drag neighbours in',
    'Ice-rich orbits · fragments worth more',
    'Volatile shard storms · fragments worth more',
    'Star crystals bloom here · fragments worth more'
  ];

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  let state, stats, world, mutation, todayKey;
  const ev = [];
  let reduced = false;
  let lastWall = Date.now();
  let lastBackup = 0;
  let modalOpen = null;
  let collapsing = false;
  let frozen = false;   // test hook: behave like a tab that was killed without saving

  function now() { return Date.now(); }

  function loadState() {
    const t = now();
    const main = PS.parseSave(Platform.get(SAVE_KEY), t);
    const bak = PS.parseSave(Platform.get(BAK_KEY), t);
    let res = main;
    let notice = null;
    if (main && !main.ok) {
      try { Platform.set(BAD_KEY, Platform.get(SAVE_KEY) || ''); } catch (e) { /* ignore */ }
      if (bak && bak.ok && (main.broken || bak.state.lifetime > main.state.lifetime)) { res = bak; notice = 'Your save was damaged — restored the latest backup.'; }
      else if (main.broken) { res = null; notice = 'Your save could not be read, so a new universe was started.'; }
    }
    if (!res && bak && bak.ok) { res = bak; notice = notice || 'Restored your universe from backup.'; }
    return { state: res ? res.state : PS.createState(t), fresh: !res, notice: notice };
  }

  function save() {
    if (COVER || frozen) return;
    state.lastSeen = now();
    Platform.set(SAVE_KEY, PS.serialize(state));
  }

  function backup() {
    if (COVER || frozen) return;
    Platform.set(BAK_KEY, PS.serialize(state));
    lastBackup = performance.now();
  }

  function refreshStats() { stats = PS.derive(state, mutation); }

  function rollMutation() {
    todayKey = PS.dayKey(new Date());
    mutation = PS.mutationFor(todayKey);
  }

  // ---------------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const el = {
    universe: $('universe'), cv: $('cv'), matter: $('matter'), rate: $('rate'),
    sectorNum: $('sector-num'), sectorName: $('sector-name'), mut: $('mutation-chip'),
    surge: $('surge'), banner: $('banner'), toasts: $('toasts'), hint: $('hint'),
    pulse: $('btn-pulse'), pulseCd: $('pulse-cd'), msText: $('ms-text'), msVal: $('ms-val'), msFill: $('ms-fill'),
    shop: $('shop'), collapse: $('collapse-card'), atlasBtn: $('btn-atlas'), atlasCount: $('atlas-count'),
    sound: $('btn-sound'), settings: $('btn-settings'),
    modal: $('modal'), modalTitle: $('modal-title'), modalBody: $('modal-body'), modalActions: $('modal-actions'), modalX: $('modal-x')
  };
  const ctx = el.cv.getContext('2d', { alpha: false });

  // Sets text only when it changed, so per-frame UI updates never thrash the DOM.
  const textCache = new WeakMap();
  function setText(node, s) { if (textCache.get(node) !== s) { textCache.set(node, s); node.textContent = s; } }
  function setHTML(node, s) { if (textCache.get(node) !== s) { textCache.set(node, s); node.innerHTML = s; } }

  const ICONS = {
    radius: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.4" fill="currentColor"/><circle cx="10" cy="10" r="5.4" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".75"/><circle cx="10" cy="10" r="8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.4 2.2" opacity=".55"/></svg>',

    drones: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="currentColor"/><ellipse cx="10" cy="10" rx="8" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M16.8 5.2l1.8 3.4-3.8-.4z" fill="currentColor"/><path d="M3.2 14.8l-1.8-3.4 3.8.4z" fill="currentColor"/></svg>',
    resonance: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 10c1.6-4 3.4-4 5 0s3.4 4 5 0 3.4-4 6 0"/><circle cx="2" cy="10" r=".6" fill="currentColor"/><circle cx="18" cy="10" r=".6" fill="currentColor"/></svg>',
    focus: '<svg viewBox="0 0 20 20"><path d="M10 3.5 15 10l-5 6.5L5 10z" fill="currentColor"/><path d="M10 0.8v2M10 17.2v2M0.8 10h2M17.2 10h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
  };
  const FRAG_SVG = {
    f_dust: '<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="4" fill="#94ABDD"/></svg>',
    f_ice: '<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="5" fill="#6CE8FF" stroke="#E8FDFF" stroke-width="1"/></svg>',
