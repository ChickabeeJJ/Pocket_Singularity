<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080B16">
<title>Pocket Singularity</title>
<meta name="description" content="Pulse gravity through a tiny universe and grow a black hole into a universe-eating machine.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="emblem" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="#6CE8FF" stroke-width="1.6" opacity=".7"/>
        <circle cx="16" cy="16" r="7" fill="#05070E" stroke="#6CE8FF" stroke-width="1.4"/>
        <path d="M2 16a14 5.5 0 0 0 28 0" fill="none" stroke="#A78BFA" stroke-width="1.6"/>
      </svg>
      <span class="title">Pocket Singularity</span>
    </div>
    <div class="top-actions">
      <button id="btn-atlas" class="chip" type="button" title="Discovery Atlas">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 14.5 8 8 14.5 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>
        <span>Atlas</span><span id="atlas-count" class="num">0/16</span>
      </button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="Mute sound" title="Sound (M)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z" fill="currentColor"/><path class="snd-on" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="snd-off" d="M10.5 5.5l4 5m0-5-4 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10.5" cy="4.5" r="1.9" fill="#10162A" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="11.5" r="1.9" fill="#10162A" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="play">
      <div class="universe" id="universe">
        <canvas id="cv" aria-label="The universe. Tap or press Space to pulse gravity."></canvas>
        <div class="hud-left">
          <div class="label">Matter</div>
          <div id="matter" class="matter num">0</div>
          <div id="rate" class="rate num"></div>
        </div>
        <div class="hud-right">
          <div class="label">Sector <span id="sector-num" class="num">1</span></div>
          <div id="sector-name" class="sector-name">Dust Cloud</div>
          <button id="mutation-chip" class="mut-chip" type="button" title="Today's Cosmic Mutation"></button>
        </div>
        <div id="surge" class="surge-pill num" hidden></div>
        <div id="banner" class="banner" aria-live="polite"></div>
        <div id="toasts" class="toasts" aria-live="polite"></div>
        <div id="hint" class="hint">Tap anywhere to pulse gravity</div>
      </div>
      <div class="controls">
        <button id="btn-pulse" class="pulse-btn" type="button">
          <span class="pulse-label">Pulse Gravity</span>
          <span class="pulse-key">Space</span>
          <i id="pulse-cd" class="pulse-cd"></i>
        </button>
        <div class="milestone">
          <div class="ms-row"><span id="ms-text" class="ms-text">Next sector</span><span id="ms-val" class="ms-val num"></span></div>
          <div class="bar"><i id="ms-fill"></i></div>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="shop-head">
        <span class="label">Upgrades</span>
        <div class="buy-mode" role="group" aria-label="Buy amount">
          <button type="button" data-mode="1">×1</button><button type="button" data-mode="10">×10</button><button type="button" data-mode="0">Max</button>
        </div>
      </div>
      <div id="shop" class="shop"></div>
      <div id="collapse-card" class="collapse-card"></div>
    </aside>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-x" class="modal-x" type="button" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/platform.js"></script>
<script src="js/game.js"></script>
<!-- CrazyGames SDK v3. Optional during Basic Launch; the game runs normally if it fails to load. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async onload="window.PSPlatform && PSPlatform.onSdkScript()" onerror="window.PSPlatform && PSPlatform.onSdkScript(true)"></script>
</body>
</html>
